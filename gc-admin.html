<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Scholarship Test — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#24CCE4; --brand-deep:#0FA8C6; --brand-dark:#0B7E96; --brand-pale:#E6FAFE;
  --gold:#F5A524; --gold-deep:#C97C06; --gold-pale:#FFF6E6;
  --primary:#0E2B35; --text:#15262E; --text-2:#44606C; --text-3:#8AA3AD;
  --bg:#F6FBFD; --surface:#FFFFFF; --border:#DCEAF0; --border-l:#EDF5F8;
  --ok:#1BBF6B; --ok-deep:#15A35D; --danger:#DC2626; --danger-pale:#FEF2F2;
  --warn:#D97706; --warn-pale:#FFFBEB; --review:#7C3AED;
  --ff-d:'Outfit',system-ui,sans-serif; --ff:'Plus Jakarta Sans',system-ui,sans-serif;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--text);line-height:1.5;
  -webkit-font-smoothing:antialiased}
.bar{background:var(--primary);color:#fff;padding:13px 20px;display:flex;align-items:center;
  justify-content:space-between;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.bar h1{font-family:var(--ff-d);font-size:17px;font-weight:700;letter-spacing:-.01em}
.bar .meta{font-size:12.5px;color:#9FC6CF;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
.dot.closed{background:var(--text-3)}
.wrap{max-width:1280px;margin:0 auto;padding:20px}

/* gate */
.gate{max-width:380px;margin:80px auto;background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:30px 28px;box-shadow:0 14px 40px rgba(5,46,58,.10)}
.gate h2{font-family:var(--ff-d);font-size:21px;margin-bottom:6px}
.gate p{font-size:13.5px;color:var(--text-2);margin-bottom:20px}
input[type=password],input[type=search]{width:100%;font-family:inherit;font-size:15px;padding:12px 13px;
  border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-pale)}
.btn{font-family:inherit;font-size:14px;font-weight:700;border:none;border-radius:10px;
  padding:11px 18px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn-p{background:var(--brand-deep);color:#fff}
.btn-p:hover{background:var(--brand-dark)}
.btn-g{background:var(--surface);color:var(--text-2);border:1.5px solid var(--border)}
.btn-g:hover{border-color:var(--brand);color:var(--brand-dark)}
.btn-dl{background:var(--ok);color:#fff}
.btn-dl:hover{background:var(--ok-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.gate .btn{width:100%;margin-top:14px;justify-content:center}
.err{color:var(--danger);font-size:13px;margin-top:10px;display:none}
.err.show{display:block}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px}
.stat .n{font-family:var(--ff-d);font-size:27px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.stat .l{font-size:11.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;
  margin-top:5px;font-weight:600}
.stat.good .n{color:var(--ok-deep)} .stat.warn .n{color:var(--warn)}
.stat.bad .n{color:var(--danger)} .stat.brand .n{color:var(--brand-deep)}

/* tabs + toolbar */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{font-family:inherit;font-size:14px;font-weight:700;background:none;border:none;cursor:pointer;
  padding:11px 16px;color:var(--text-3);border-bottom:3px solid transparent;margin-bottom:-2px;
  white-space:nowrap}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--brand-dark);border-bottom-color:var(--brand)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .grow{flex:1;min-width:190px}
.count{font-size:13px;color:var(--text-3);white-space:nowrap}

/* table */
.tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  overflow:auto;max-height:68vh}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:#F2F9FB;text-align:left;padding:11px 13px;font-weight:700;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.055em;color:var(--text-2);
  border-bottom:1.5px solid var(--border);white-space:nowrap;z-index:2;cursor:pointer;user-select:none}
th:hover{color:var(--brand-dark)}
th .ar{opacity:.4;font-size:10px;margin-left:3px}
td{padding:10px 13px;border-bottom:1px solid var(--border-l);white-space:nowrap}
tbody tr:hover{background:var(--brand-pale)}
tbody tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums;text-align:right}
.rank{font-family:var(--ff-d);font-weight:700;font-variant-numeric:tabular-nums}
.r1{color:var(--gold-deep)}
.score{font-family:var(--ff-d);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--border-l);color:var(--text-2)}
.pill.gold{background:var(--gold-pale);color:var(--gold-deep)}
.pill.cyan{background:var(--brand-pale);color:var(--brand-dark)}
.pill.ok{background:#E7FBEF;color:#0B5C34}
.pill.bad{background:var(--danger-pale);color:#991B1B}
.pill.warn{background:var(--warn-pale);color:#92400E}
.pill.rev{background:#F5F3FF;color:var(--review)}
.empty{padding:50px 20px;text-align:center;color:var(--text-3);font-size:14px}
.note{background:var(--gold-pale);border:1px solid #FBE3B4;border-radius:var(--r);
  padding:13px 16px;font-size:13.5px;color:#7A4B07;margin-bottom:16px}
.note b{color:#5C3805}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--brand);
  border-radius:50%;animation:sp .8s linear infinite;margin:50px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:640px){
  .wrap{padding:14px}.bar{padding:11px 14px}.bar h1{font-size:15px}
  .stat .n{font-size:22px}td,th{padding:9px 10px}
}
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2>Admin access</h2>
  <p>Scholarship Test &mdash; Global Careers by Testbook. Enter the admin key to view scores and registrations.</p>
  <input id="key" type="password" placeholder="Admin key" autocomplete="current-password" spellcheck="false">
  <button class="btn btn-p" id="go">Open dashboard</button>
  <div class="err" id="gate-err"></div>
</div>

<div id="app" style="display:none">
  <div class="bar">
    <h1>Scholarship Test &mdash; Admin</h1>
    <div class="meta">
      <span id="phase"></span>
      <span id="stamp"></span>
      <button class="btn btn-g" id="refresh" style="padding:6px 12px;font-size:12.5px">Refresh</button>
      <button class="btn btn-g" id="logout" style="padding:6px 12px;font-size:12.5px">Lock</button>
    </div>
  </div>

  <div class="wrap">
    <div id="stranded" class="note" style="display:none;background:var(--danger-pale);
         border-color:#FECACA;color:#7F1D1D"></div>
    <div id="gatewarn" class="note" style="display:none"></div>
    <div class="stats" id="stats"></div>

    <div class="tabs">
      <button class="tab on" data-v="leaderboard">Leaderboard</button>
      <button class="tab" data-v="registrations">All registrations</button>
      <button class="tab" data-v="ties">Tie groups</button>
    </div>

    <div class="toolbar">
      <div class="grow"><input id="q" type="search" placeholder="Search name or number…"></div>
      <span class="count" id="count"></span>
      <button class="btn btn-dl" id="dl-csv">Download CSV</button>
      <button class="btn btn-g" id="dl-xls">Download for Excel</button>
    </div>

    <div class="tablewrap"><div id="table"></div></div>
  </div>
</div>

<script>
(function () {
'use strict';
var SUPABASE_URL = 'https://uxdrldreaockdloqvojs.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4ZHJsZHJlYW9ja2Rsb3F2b2pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MzE2MjIsImV4cCI6MjA4OTQwNzYyMn0.swqYBfGzHP5qSDPnZ_AivFE0zljyK33Kq-_ephz4Ybc';
var API = SUPABASE_URL + '/functions/v1/scholarship-api';
// sessionStorage, not localStorage: the key dies with the tab rather than
// sitting on the machine afterwards.
var SK = 'gcb_admin_key';

function $(id) { return document.getElementById(id); }
var DATA = null, VIEW = 'leaderboard', SORT = { col: null, dir: 1 };

function adminKey() { try { return sessionStorage.getItem(SK) || ''; } catch (e) { return ''; } }

function load(key) {
  return fetch(API, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + SUPABASE_KEY, 'apikey': SUPABASE_KEY,
               'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'admin', admin_key: key })
  }).then(function (r) { return r.json().catch(function () { return { ok: false }; }); });
}

/* ---- columns per view -------------------------------------------------- */
var COLS = {
  leaderboard: [
    { k: 'rank', t: 'Rank', cls: 'rank' },
    { k: 'name', t: 'Name' },
    { k: 'phone', t: 'Mobile' },
    { k: 'score', t: 'Score', cls: 'score num' },
    { k: 'correct', t: 'Correct', cls: 'num' },
    { k: 'wrong', t: 'Wrong', cls: 'num' },
    { k: 'unanswered', t: 'Skipped', cls: 'num' },
    { k: 'started_at', t: 'Started', fmt: 'time' },
    { k: 'minutes_taken', t: 'Minutes', cls: 'num' },
    { k: 'scholarship', t: 'Band', fmt: 'band' },
    { k: 'submit_reason', t: 'Finished by', fmt: 'reason' },
    { k: 'strikes', t: 'Strikes', cls: 'num', fmt: 'strikes' },
    { k: 'disqualified', t: 'Flagged', fmt: 'flag' },
    { k: 'submitted_at', t: 'Submitted', fmt: 'time' }
  ],
  registrations: [
    { k: 'name', t: 'Name' },
    { k: 'phone', t: 'Mobile' },
    { k: 'registered_at', t: 'Registered', fmt: 'time' },
    { k: 'test_status', t: 'Test status', fmt: 'status' },
    { k: 'score', t: 'Score', cls: 'score num' },
    { k: 'correct', t: 'Correct', cls: 'num' },
    { k: 'minutes_taken', t: 'Minutes', cls: 'num' },
    { k: 'submitted_at', t: 'Submitted', fmt: 'time' },
    { k: 'utm_source', t: 'Source' },
    { k: 'utm_medium', t: 'Medium' },
    { k: 'utm_campaign', t: 'Campaign' }
  ],
  ties: [
    { k: 'rank', t: 'Rank', cls: 'rank' },
    { k: 'score', t: 'Score', cls: 'score num' },
    { k: 'students_on_this_score', t: 'Students tied', cls: 'num' },
    { k: 'position_from', t: 'From', cls: 'num' },
    { k: 'position_to', t: 'To', cls: 'num' },
    { k: 'action', t: 'Action needed', fmt: 'action' }
  ]
};
function rows() {
  if (!DATA) return [];
  if (VIEW === 'leaderboard') return DATA.leaderboard || [];
  if (VIEW === 'registrations') return DATA.registrations || [];
  return DATA.tie_groups || [];
}

/* ---- formatting -------------------------------------------------------- */
function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function ist(v) {
  if (!v) return '';
  var d = new Date(v);
  if (isNaN(d)) return '';
  return d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short',
    hour: '2-digit', minute: '2-digit', hour12: true });
}
// Plain text for the export — the pills are presentation only.
function plain(row, c) {
  var v = row[c.k];
  if (c.fmt === 'time') return ist(v);
  if (c.fmt === 'flag') return v ? 'YES' : '';
  if (v === null || v === undefined) return '';
  return String(v);
}
function cell(row, c) {
  var v = row[c.k];
  if (c.fmt === 'time') return esc(ist(v));
  if (c.fmt === 'band') {
    if (!v) return '';
    var g = /100%/.test(v);
    return '<span class="pill ' + (g ? 'gold' : 'cyan') + '">' + esc(v) + '</span>';
  }
  if (c.fmt === 'reason') {
    var m = { manual: ['ok', 'Submitted'], timer: ['warn', 'Time over'],
              navigation: ['bad', 'Left page'], strikes: ['bad', 'Three strikes'] };
    var x = m[v]; if (!x) return esc(v || '');
    return '<span class="pill ' + x[0] + '">' + x[1] + '</span>';
  }
  if (c.fmt === 'status') {
    var s = { submitted: ['ok', 'Submitted'], auto_submitted: ['warn', 'Auto-submitted'],
              in_progress: ['rev', 'Writing now'], not_started: ['', 'Not started'] };
    var y = s[v] || ['', v || 'Not started'];
    return '<span class="pill ' + y[0] + '">' + esc(y[1]) + '</span>';
  }
  if (c.fmt === 'strikes') {
    if (!v) return '<span style="color:var(--text-3)">0</span>';
    return '<span class="pill bad">' + esc(v) + '</span>';
  }
  if (c.fmt === 'flag') return v ? '<span class="pill bad">Review</span>' : '';
  if (c.fmt === 'action') {
    if (!v) return '';
    return '<span class="pill ' + (/draw/i.test(v) ? 'gold' : '') + '">' + esc(v) + '</span>';
  }
  if (v === null || v === undefined) return '<span style="color:var(--text-3)">&mdash;</span>';
  return esc(v);
}

/* ---- render ------------------------------------------------------------ */
function visible() {
  var q = ($('q').value || '').trim().toLowerCase();
  var list = rows().slice();
  if (q) {
    list = list.filter(function (r) {
      return String(r.name || '').toLowerCase().indexOf(q) > -1
          || String(r.phone || '').indexOf(q) > -1;
    });
  }
  if (SORT.col) {
    list.sort(function (a, b) {
      var x = a[SORT.col], y = b[SORT.col];
      if (x === null || x === undefined) return 1;
      if (y === null || y === undefined) return -1;
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * SORT.dir;
      return String(x).localeCompare(String(y)) * SORT.dir;
    });
  }
  return list;
}

function draw() {
  var cols = COLS[VIEW], list = visible();
  $('count').textContent = list.length + (list.length === 1 ? ' row' : ' rows');
  if (!list.length) {
    $('table').innerHTML = '<div class="empty">Nothing to show here yet.</div>';
    return;
  }
  var h = '<table><thead><tr>';
  cols.forEach(function (c) {
    var ar = SORT.col === c.k ? (SORT.dir > 0 ? ' \u25b2' : ' \u25bc') : '';
    h += '<th data-c="' + c.k + '">' + esc(c.t) + '<span class="ar">' + ar + '</span></th>';
  });
  h += '</tr></thead><tbody>';
  list.forEach(function (r) {
    h += '<tr>';
    cols.forEach(function (c) {
      var cls = c.cls || '';
      if (c.k === 'rank' && Number(r.rank) <= 3) cls += ' r1';
      h += '<td class="' + cls + '">' + cell(r, c) + '</td>';
    });
    h += '</tr>';
  });
  $('table').innerHTML = h + '</tbody></table>';

  Array.prototype.forEach.call($('table').querySelectorAll('th'), function (th) {
    th.addEventListener('click', function () {
      var c = th.getAttribute('data-c');
      SORT.dir = (SORT.col === c) ? -SORT.dir : 1;
      SORT.col = c;
      draw();
    });
  });
}

function paintStats() {
  var s = DATA.summary || {};
  var cards = [
    ['brand', s.registered, 'Registered'],
    ['', s.started, 'Started'],
    ['good', s.submitted, 'Submitted'],
    ['warn', s.in_progress, DATA.phase === 'open' ? 'Writing now' : 'Unfinished'],
    ['', s.not_started, 'Never started'],
    ['good', s.highest, 'Highest score'],
    ['', s.average, 'Average'],
    ['bad', (s.auto_strikes || 0) + (s.auto_navigation || 0) + (s.auto_timer || 0), 'Auto-submitted']
  ];
  $('stats').innerHTML = cards.map(function (c) {
    var v = (c[1] === null || c[1] === undefined) ? '&mdash;' : c[1];
    return '<div class="stat ' + c[0] + '"><div class="n">' + v + '</div><div class="l">'
      + c[2] + '</div></div>';
  }).join('');

  $('phase').innerHTML = '<span class="dot ' + (DATA.phase === 'open' ? '' : 'closed')
    + '"></span>' + ({ before: 'Not open', open: 'Test is LIVE', entry_closed: 'Entry closed',
        closed: 'Test closed' }[DATA.phase] || DATA.phase);
  $('stamp').textContent = 'Updated ' + ist(DATA.server_now);

  // An attempt only closes itself when the browser is still alive to do it.
  // A hard-killed tab leaves the row in_progress with its answers saved but
  // never marked, so after the window shuts those are unscored papers, not
  // people still writing -- and they would be missing from the leaderboard.
  var strand = $('stranded');
  if (DATA.phase !== 'open' && s.in_progress > 0) {
    strand.style.display = 'block';
    strand.innerHTML = '<b>' + s.in_progress + ' attempt'
      + (s.in_progress === 1 ? ' was' : 's were') + ' never finished.</b> '
      + 'The window is closed, so these are papers abandoned mid-test &mdash; the browser was '
      + 'shut before the test could submit itself. Their answers are saved but <b>not scored</b>, '
      + 'so they do not appear in the leaderboard below. They need finalising before results go out.';
  } else { strand.style.display = 'none'; }

  // The students cannot see any of this until the gate opens on Wednesday.
  var w = $('gatewarn');
  if (!DATA.results_published) {
    w.style.display = 'block';
    w.innerHTML = '<b>Scores are visible to you only.</b> Students cannot see marks or the '
      + 'answer key until <b>' + ist(DATA.results_visible_at) + '</b>. Ranks below are live and '
      + 'will keep moving while attempts are still coming in.';
  } else { w.style.display = 'none'; }
}

/* ---- export ------------------------------------------------------------ */
function stamp() {
  var d = new Date();
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}
function save(blob, filename) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function csvCell(v) {
  var s = String(v === null || v === undefined ? '' : v);
  // A leading =, +, - or @ makes Excel treat the cell as a formula. Names and
  // numbers from a public form are untrusted input, so they get neutralised.
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCSV() {
  var cols = COLS[VIEW], list = visible();
  if (!list.length) return;
  var lines = [cols.map(function (c) { return csvCell(c.t); }).join(',')];
  list.forEach(function (r) {
    lines.push(cols.map(function (c) { return csvCell(plain(r, c)); }).join(','));
  });
  // The BOM is what makes Excel read it as UTF-8, so Indic names survive.
  save(new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }),
       'scholarship-' + VIEW + '-' + stamp() + '.csv');
}
// A real spreadsheet file, so Excel keeps the columns without an import step.
function downloadXLS() {
  var cols = COLS[VIEW], list = visible();
  if (!list.length) return;
  var h = '<table><thead><tr>'
    + cols.map(function (c) { return '<th>' + esc(c.t) + '</th>'; }).join('')
    + '</tr></thead><tbody>'
    + list.map(function (r) {
        return '<tr>' + cols.map(function (c) {
          // Mobile numbers must stay text or Excel eats the leading digit
          // shape and renders them in scientific notation.
          var t = (c.k === 'phone') ? ' style="mso-number-format:\'\\@\'"' : '';
          return '<td' + t + '>' + esc(plain(r, c)) + '</td>';
        }).join('') + '</tr>';
      }).join('')
    + '</tbody></table>';
  var doc = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'
    + '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'
    + '<x:Name>' + VIEW + '</x:Name><x:WorksheetOptions><x:DisplayGridlines/>'
    + '</x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'
    + '<style>th{background:#DCEAF0;font-weight:700}td,th{border:1px solid #B8CFD8;padding:4px}</style>'
    + '</head><body>' + h + '</body></html>';
  save(new Blob(['\ufeff' + doc], { type: 'application/vnd.ms-excel;charset=utf-8' }),
       'scholarship-' + VIEW + '-' + stamp() + '.xls');
}

/* ---- wiring ------------------------------------------------------------ */
function refresh() {
  var k = adminKey();
  if (!k) return;
  $('refresh').disabled = true;
  return load(k).then(function (r) {
    $('refresh').disabled = false;
    if (!r || !r.ok) {
      if (r && r.code === 'unauthorized') { lock(); return; }
      alert((r && r.message) || 'Could not load. Try again.');
      return;
    }
    DATA = r; paintStats(); draw();
  }).catch(function () {
    $('refresh').disabled = false;
    alert('Network problem. Check your connection and press Refresh.');
  });
}
function open_() { $('gate').style.display = 'none'; $('app').style.display = 'block'; refresh(); }
function lock() {
  try { sessionStorage.removeItem(SK); } catch (e) {}
  DATA = null;
  $('app').style.display = 'none'; $('gate').style.display = 'block';
  $('key').value = ''; $('key').focus();
}

$('go').addEventListener('click', function () {
  var k = $('key').value.trim();
  if (!k) return;
  $('go').disabled = true; $('gate-err').classList.remove('show');
  load(k).then(function (r) {
    $('go').disabled = false;
    if (!r || !r.ok) {
      $('gate-err').textContent = (r && r.code === 'unauthorized')
        ? 'That key is not valid.' : ((r && r.message) || 'Could not connect.');
      $('gate-err').classList.add('show');
      return;
    }
    try { sessionStorage.setItem(SK, k); } catch (e) {}
    DATA = r; open_(); paintStats(); draw();
  }).catch(function () {
    $('go').disabled = false;
    $('gate-err').textContent = 'Could not reach the server.';
    $('gate-err').classList.add('show');
  });
});
$('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('go').click(); });
$('refresh').addEventListener('click', refresh);
$('logout').addEventListener('click', lock);
$('q').addEventListener('input', draw);
$('dl-csv').addEventListener('click', downloadCSV);
$('dl-xls').addEventListener('click', downloadXLS);
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
  t.addEventListener('click', function () {
    document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    VIEW = t.getAttribute('data-v');
    SORT = { col: null, dir: 1 };
    $('q').value = '';
    $('q').style.visibility = (VIEW === 'ties') ? 'hidden' : 'visible';
    draw();
  });
});

// While the window is open the numbers move, so keep them current without
// the operator having to think about it.
setInterval(function () { if (DATA && DATA.phase === 'open') refresh(); }, 60000);

if (adminKey()) open_(); else $('key').focus();
})();
</script>
</body>
</html>
